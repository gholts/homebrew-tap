name: Update formulas

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-formulas
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Update formulas from latest stable releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          updates="$(python3 .github/update-formulas.py)"
          if [[ -z "$updates" ]]; then
            echo 'Formulas are current.'
            exit 0
          fi
          while read -r formula release_tag; do
            echo "Updating $formula to $release_tag"
            git add "Formula/$formula.rb"
          done <<< "$updates"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update formulas' -m "$updates"
          git push origin HEAD:main
